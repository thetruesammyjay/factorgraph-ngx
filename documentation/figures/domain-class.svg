<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="t d">
<title id="t">UML domain class diagram</title><desc id="d">Research-domain classes for issuer identities, price and fundamental observations, dataset versions, and persisted experiments.</desc>
<style>.bg{fill:#f8faf7}.c{fill:#fff;stroke:#345e3e;stroke-width:2}.h{fill:#e4f0df}.title{font:700 26px Arial;fill:#173d22}.n{font:700 16px Arial;fill:#173d22}.f{font:14px Arial;fill:#263c2b}.rel{stroke:#405b45;stroke-width:2;fill:none}.multi{font:13px Arial;fill:#405b45}</style>
<rect class="bg" width="1280" height="850"/><text class="title" x="640" y="42" text-anchor="middle">UML domain class model</text>
<g transform="translate(50 100)"><rect class="c" width="250" height="135"/><rect class="h" width="250" height="34"/><text class="n" x="125" y="23" text-anchor="middle">Company</text><text class="f" x="12" y="59">id: UUID</text><text class="f" x="12" y="82">ticker, ISIN, name</text><text class="f" x="12" y="105">sector, listing dates, active</text></g>
<g transform="translate(50 330)"><rect class="c" width="250" height="135"/><rect class="h" width="250" height="34"/><text class="n" x="125" y="23" text-anchor="middle">SecurityIdentifier</text><text class="f" x="12" y="59">id, company_id</text><text class="f" x="12" y="82">ticker, ISIN</text><text class="f" x="12" y="105">valid_from, valid_to, is_primary</text></g>
<g transform="translate(375 100)"><rect class="c" width="280" height="160"/><rect class="h" width="280" height="34"/><text class="n" x="140" y="23" text-anchor="middle">PriceObservation</text><text class="f" x="12" y="59">company_id, trading_date</text><text class="f" x="12" y="82">OHLC, adjusted_close</text><text class="f" x="12" y="105">volume, value, transaction_count</text><text class="f" x="12" y="128">dataset_version_id</text></g>
<g transform="translate(375 330)"><rect class="c" width="280" height="183"/><rect class="h" width="280" height="34"/><text class="n" x="140" y="23" text-anchor="middle">FundamentalObservation</text><text class="f" x="12" y="59">company_id, fiscal_period</text><text class="f" x="12" y="82">publication_date, effective_from</text><text class="f" x="12" y="105">book_equity, shares_outstanding</text><text class="f" x="12" y="128">source_document, date_source</text><text class="f" x="12" y="151">dataset_version_id</text></g>
<g transform="translate(375 600)"><rect class="c" width="280" height="140"/><rect class="h" width="280" height="34"/><text class="n" x="140" y="23" text-anchor="middle">CorporateAction</text><text class="f" x="12" y="59">company_id, action_date</text><text class="f" x="12" y="82">action_type, adjustment_factor</text><text class="f" x="12" y="105">cash_amount, details</text></g>
<g transform="translate(745 100)"><rect class="c" width="250" height="140"/><rect class="h" width="250" height="34"/><text class="n" x="125" y="23" text-anchor="middle">DatasetVersion</text><text class="f" x="12" y="59">id, version, source</text><text class="f" x="12" y="82">coverage_start, coverage_end</text><text class="f" x="12" y="105">manifest, created_at</text></g>
<g transform="translate(745 355)"><rect class="c" width="250" height="140"/><rect class="h" width="250" height="34"/><text class="n" x="125" y="23" text-anchor="middle">BenchmarkObservation</text><text class="f" x="12" y="59">benchmark_code, trading_date</text><text class="f" x="12" y="82">close, adjusted_close</text><text class="f" x="12" y="105">dataset_version_id</text></g>
<g transform="translate(745 600)"><rect class="c" width="250" height="140"/><rect class="h" width="250" height="34"/><text class="n" x="125" y="23" text-anchor="middle">RiskFreeObservation</text><text class="f" x="12" y="59">observation_date, tenor</text><text class="f" x="12" y="82">annualized_rate</text><text class="f" x="12" y="105">dataset_version_id</text></g>
<g transform="translate(1040 265)"><rect class="c" width="210" height="230"/><rect class="h" width="210" height="34"/><text class="n" x="105" y="23" text-anchor="middle">Experiment</text><text class="f" x="12" y="59">id, name, config</text><text class="f" x="12" y="82">status, dataset_version</text><text class="f" x="12" y="105">execution_trace</text><text class="f" x="12" y="128">node_outputs, constraints</text><text class="f" x="12" y="151">run_fingerprint</text><text class="f" x="12" y="174">errors, completed_at</text><text class="f" x="12" y="205">one record per run</text></g>
<path class="rel" d="M175 235V325M300 168H365M300 180H335V408H365M300 195H335V670H365M655 165H735M655 405H720V205H735M655 670H720V225H735M995 170H1015V300H1035M995 420H1020M995 670H1020V460H1035"/>
<text class="multi" x="308" y="154">1</text><text class="multi" x="345" y="154">0..*</text><text class="multi" x="183" y="285">1</text><text class="multi" x="183" y="318">0..*</text><text class="multi" x="670" y="152">0..1</text><text class="multi" x="700" y="152">0..*</text>
<text class="f" x="640" y="800" text-anchor="middle">The experiment stores its dataset-version label and JSON trace; it is not shown as a relational foreign key.</text>
</svg>
