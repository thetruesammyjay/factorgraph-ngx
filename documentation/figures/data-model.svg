<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="900" viewBox="0 0 1460 900" role="img" aria-labelledby="t d">
<title id="t">the research platform relational data model</title><desc id="d">Core PostgreSQL entities: companies, security identifiers, price observations, fundamentals, corporate actions, benchmark observations, risk-free observations, dataset versions, and experiments with graph traces stored in JSON fields.</desc>
