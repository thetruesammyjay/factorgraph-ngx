<g transform="translate(365 365)"><rect class="box" width="300" height="210" rx="9"/><path class="head" d="M0 9a9 9 0 0 1 9-9h282a9 9 0 0 1 9 9v34H0z"/><text class="name" x="150" y="28" text-anchor="middle">fundamental_observations</text><text class="field" x="15" y="68">PK id, FK company_id</text><text class="field" x="15" y="91">fiscal_period, publication_date</text><text class="field" x="15" y="114">effective_from, date_source</text><text class="field" x="15" y="137">book_equity, shares_outstanding</text><text class="field" x="15" y="160">source_document, financial fields</text><text class="field" x="15" y="183">FK dataset_version_id</text></g>
