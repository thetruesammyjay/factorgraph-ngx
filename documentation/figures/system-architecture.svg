<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">the research platform implemented system architecture</title>
<desc id="desc">Public NGX data flows through provenance and validation, point-in-time alignment, eligibility gates, deterministic Python calculations, LangGraph run records, FastAPI, and the Next.js research console. Liquidity and regime analysis are blocked for the current pilot.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#23723a"/></marker>
  <style>
    .bg{fill:#f7faf6}.box{fill:#fff;stroke:#9bbf91;stroke-width:2}.dark{fill:#123d20;stroke:#123d20}.green{fill:#e6f4dc;stroke:#6ba957}.amber{fill:#fff5d7;stroke:#d4a52a}.blue{fill:#eaf2fb;stroke:#6a92c1}.txt{font:20px Arial,sans-serif;fill:#183322}.small{font:15px Arial,sans-serif;fill:#3c5842}.white{fill:#fff}.title{font:700 30px Arial,sans-serif;fill:#123d20}.arrow{stroke:#23723a;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}
  </style>
</defs>
