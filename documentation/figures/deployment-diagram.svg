<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">UML deployment diagram</title><desc id="d">Target deployment places the Next.js application at Vercel, the FastAPI and research modules at Railway, and optional PostgreSQL at Neon. Local development can use the API in-memory store.</desc>
<style>.bg{fill:#f8faf7}.node{fill:#fff;stroke:#4d7f50;stroke-width:2.5}.head{fill:#e7f2e2}.t{font:16px Arial;fill:#173522}.n{font:700 20px Arial;fill:#173d22}.s{font:14px Arial;fill:#405642}.l{stroke:#355c3b;stroke-width:2.5;fill:none}.dash{stroke-dasharray:8 6}</style>
<rect class="bg" width="1200" height="700"/><text class="n" x="600" y="42" text-anchor="middle">UML deployment view (target topology)</text>
<rect class="node" x="70" y="110" width="300" height="430" rx="16"/><rect class="head" x="70" y="110" width="300" height="55" rx="16"/><text class="n" x="220" y="145" text-anchor="middle">Vercel</text><text class="s" x="220" y="185" text-anchor="middle">Managed web deployment</text><rect class="head" x="115" y="230" width="210" height="90" rx="12"/><text class="t" x="220" y="267" text-anchor="middle">Next.js application</text><text class="s" x="220" y="293" text-anchor="middle">Browser-delivered UI</text><rect class="head" x="115" y="360" width="210" height="90" rx="12"/><text class="t" x="220" y="397" text-anchor="middle">Research console</text><text class="s" x="220" y="423" text-anchor="middle">HTTPS API requests</text>
<rect class="node" x="450" y="110" width="350" height="430" rx="16"/><rect class="head" x="450" y="110" width="350" height="55" rx="16"/><text class="n" x="625" y="145" text-anchor="middle">Railway</text><text class="s" x="625" y="185" text-anchor="middle">FastAPI service deployment</text><rect class="head" x="505" y="230" width="240" height="75" rx="12"/><text class="t" x="625" y="275" text-anchor="middle">FastAPI routes</text><rect class="head" x="505" y="335" width="240" height="75" rx="12"/><text class="t" x="625" y="380" text-anchor="middle">LangGraph + Python engine</text><rect class="head" x="505" y="440" width="240" height="65" rx="12"/><text class="t" x="625" y="478" text-anchor="middle">Environment configuration</text>
<path class="l" d="M370 400h75M625 305v25"/>
<rect class="node" x="880" y="205" width="260" height="250" rx="16"/><rect class="head" x="880" y="205" width="260" height="55" rx="16"/><text class="n" x="1010" y="240" text-anchor="middle">Neon (optional)</text><text class="t" x="1010" y="300" text-anchor="middle">PostgreSQL</text><text class="s" x="1010" y="332" text-anchor="middle">Experiments and graph outputs</text><text class="s" x="1010" y="362" text-anchor="middle">when DATABASE_URL is set</text><text class="s" x="1010" y="410" text-anchor="middle">Local mode: in-memory store</text>
<path class="l dash" d="M800 372h75"/><text class="s" x="837" y="357" text-anchor="middle">SQL</text>
<text class="s" x="600" y="610" text-anchor="middle">Deployment services are project targets. This diagram does not claim that production instances are currently active.</text>
</svg>
