[project]
name = "ngx-research-api"
version = "0.1.0"
description = "Deterministic research API for the NGX multi-factor platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pandas>=2.2.0",
  "numpy>=2.1.0",
  "scipy>=1.14.0",
  "statsmodels>=0.14.0",
  "scikit-learn>=1.5.0",
  "hmmlearn>=0.3.3",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "langgraph>=0.2.0",
  "httpx>=0.28.0",
  "psycopg2>=2.9.13",
  "pypdf",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py312"
